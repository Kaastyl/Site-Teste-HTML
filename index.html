<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            text-align: left;
        }

        input {
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<h2>Qual é o seu nome?</h2>

<input id="nome" type="text" placeholder="Insira seu nome" maxlength="20">

<button onclick="mostrarNome()">Enviar</button>

<p id="mensagem"></p>

<script>
function mostrarNome() {
    let nome = document.getElementById("nome").value;
    document.getElementById("mensagem").innerHTML = "teu nome é " + nome + "? NOME DE VIADO KKKKKKKKKKK";
    <img src="https://media.tenor.com/ShXqrVOXsM0AAAAj/scuba-scuba-dance.gif" width="300">
}
</script>

</body>
</html>
